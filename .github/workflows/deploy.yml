# 서비스 저장소의 배포 구조를 흉내 낸다: CI 가 main 에서 성공하면 deploy 가 돌고, 저장소 변수 CD_ENABLED 가 'true' 일 때만 실제로 실행한다.
# 서버·러너는 없다(ubuntu-latest 에서 echo 만 한다).
name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
jobs:
  deploy:
    name: deploy
    if: github.event.workflow_run.conclusion == 'success' && vars.CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "배포 실행: 머지 커밋 ${{ github.event.workflow_run.head_sha }}"
